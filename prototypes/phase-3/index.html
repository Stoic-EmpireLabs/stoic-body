<!doctype html>
<html lang="en" data-theme="night">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Stoic Body — interactive design preview</title>
  <link rel="stylesheet" href="styles.css">
  <script src="appearance.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="preview-bar" aria-label="Prototype controls">
    <span><span class="preview-dot"></span> DESIGN PREVIEW <span class="preview-detail">· Fictional data · Sample logs reset</span></span>
    <div class="theme-options" role="group" aria-label="Visual direction">
      <button data-theme-option="night" aria-pressed="true"><span class="swatch night"></span>Crimson &amp; Gold</button>
      <button data-theme-option="marble" aria-pressed="false"><span class="swatch marble"></span>Quiet Marble</button>
      <button data-theme-option="journal" aria-pressed="false"><span class="swatch journal"></span>Training Journal</button>
    </div>
  </div>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#today" aria-label="Stoic Body home"><span class="brand-mark" aria-hidden="true">S<span>•</span></span><span>STOIC<br><b>BODY</b></span></a>
      <div class="workspace-name">YOUR DAILY PRACTICE</div>
      <nav id="desktop-nav" aria-label="Main navigation"></nav>
      <div class="sidebar-bottom">
        <button class="sidebar-link" data-view="onboarding"><span aria-hidden="true">✧</span> Shape your plan</button>
        <button class="sidebar-link" data-view="settings"><span aria-hidden="true">⚙</span> Settings & devices</button>
        <div class="profile-mini"><span class="avatar">A</span><div><strong>Alex's journey</strong><small>Fictional preview profile</small></div></div>
      </div>
    </aside>
    <div class="workspace">
      <header class="topbar"><div class="breadcrumb">Your practice <span>/</span> <strong id="breadcrumb">Today</strong></div><div class="top-actions"><button class="sync-pill" data-view="settings"><span class="status-dot"></span><span>Sync preview</span></button><button id="calm-toggle" class="icon-button" aria-label="Enable calm mode" aria-pressed="false"></button><button class="icon-button" data-view="settings" aria-label="Theme and color settings"><span aria-hidden="true">⚙</span></button></div></header>
      <main id="main" tabindex="-1"></main>
      <footer class="app-footer">Build a life you respect. One day at a time.<span>STOIC BODY / DESIGN 03</span></footer>
    </div>
  </div>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation"></nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"><div id="dialog-content"></div></dialog>
</body>
</html>
